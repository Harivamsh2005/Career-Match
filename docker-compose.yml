# Career Match — MongoDB + (Express API serving the React build)
#
#   cp .env.example .env      # then set JWT_SECRET
#   docker compose up --build
#   open http://localhost:3000
services:
  mongo:
    image: mongo:7
    container_name: rsa-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # MongoDB is intentionally NOT published to the host; only `app` can reach it.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-match:latest
    container_name: rsa-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-career_match}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example to .env)}

volumes:
  mongo-data:
